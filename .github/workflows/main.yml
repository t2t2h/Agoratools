name: Build AgoraBoost Dylib

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build dylib
        run: |
          SDK_PATH=$(xcrun --sdk iphoneos --show-sdk-path)
          clang -dynamiclib \
              -arch arm64 -arch arm64e \
              -isysroot "$SDK_PATH" \
              -miphoneos-version-min=14.0 \
              -fobjc-arc \
              -framework Foundation \
              -framework CoreGraphics \
              -install_name "@executable_path/Frameworks/AgoraBoost.dylib" \
              AgoraBoost.m \
              -o AgoraBoost.dylib
          codesign -f -s - AgoraBoost.dylib

      - name: Verify output
        run: file AgoraBoost.dylib

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: AgoraBoost-dylib
          path: AgoraBoost.dylib
          retention-days: 30
